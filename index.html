<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1B1F3B">
  <title>Imperfect World</title>
  <link rel="icon" href="assets/icon.png">
  <!-- App instalável (PWA) -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <!-- Fontes (opcional: sem internet o jogo usa as fontes do sistema) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&family=Nunito+Sans:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Palco 1280×720 com letterbox: canvas embaixo, interface HTML por cima -->
  <div id="stage">
    <canvas id="tela" width="1280" height="720" aria-label="Cena do jogo"></canvas>
    <div id="ui"></div>
  </div>

  <!-- Aviso para celular em pé -->
  <div id="girar" role="alert">
    <div class="girar-icone" aria-hidden="true">⟳</div>
    <p>Gire o celular</p>
    <small>Imperfect World é jogado na horizontal.</small>
  </div>

  <!-- Scripts comuns (sem módulos) para abrir com duplo clique -->
  <script src="js/data.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/save.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
  <script>
    // Registra o service worker (só funciona em http://localhost ou https://; no file:// é ignorado)
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
